name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Formatting check ──────────────────────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  # ── Build x86_64 bare-metal ───────────────────────────────────────
  build-x86_64:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cc dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Check build
        run: cargo check --target x86_64-unknown-none

      - name: Build
        run: cargo build --target x86_64-unknown-none

  # ── Cross-compile AArch64 ────────────────────────────────────────
  build-aarch64:
    name: Cross-compile (AArch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Check build
        run: cargo check --target aarch64-unknown-none

      - name: Build
        run: cargo build --target aarch64-unknown-none

  # ── Clippy lints ─────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Install cc dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-aarch64-linux-gnu

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── libkernel unit tests ─────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Run libkernel tests
        run: cargo test -p libkernel --target x86_64-unknown-linux-gnu --all-features

  # ── QEMU boot test (best-effort) ─────────────────────────────────
  qemu-boot:
    name: QEMU Boot (x86_64)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build-x86_64
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install QEMU and cc dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 gcc

      - name: Build kernel
        run: cargo build --target x86_64-unknown-none

      - name: QEMU boot test (30s timeout)
        run: |
          timeout 30 cargo run --target x86_64-unknown-none || true
          echo "--- Kernel ran for 30s (timeout is expected) ---"
          echo "QEMU boot test passed (kernel loaded and ran)"
